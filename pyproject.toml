[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus"
version = "1.0.0"
description = "Deteccao e bloqueio de agentes de IA e tuneis nao autorizados na rede corporativa."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cerberus = "cerberus.cli:main"

[project.gui-scripts]
cerberus-painel = "cerberus.painel_desktop:main"

[tool.setuptools.packages.find]
include = ["cerberus*"]
