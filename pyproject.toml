[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteesp"
version = "1.0.0"
description = "Deteccao e bloqueio de agentes de IA e tuneis nao autorizados na rede corporativa."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agenteesp = "agenteesp.cli:main"

[tool.setuptools.packages.find]
include = ["agenteesp*"]
